name: Build main

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version from Directory.Build.props
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ProsumentEneaItmTool.Tests --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish "ProsumentEneaItmTool/ProsumentEneaItmTool.csproj" --configuration Release --no-restore --output ./publish

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}", $env:ProgramFiles -Directory -Filter "Inno Setup*" |
            ForEach-Object { Join-Path $_.FullName "ISCC.exe" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" SetupBuilder/ProsumentEneaItmToolSetup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Archive application
        uses: actions/upload-artifact@v4
        with:
          name: ProsumentEneaItmTool
          path: ./publish

      - name: Archive installer
        uses: actions/upload-artifact@v4
        with:
          name: ProsumentEneaItmToolSetup
          path: SetupBuilder/Output/ProsumentEneaItmToolSetup.exe

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Download application
        uses: actions/download-artifact@v4
        with:
          name: ProsumentEneaItmTool
          path: ./publish

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: ProsumentEneaItmToolSetup
          path: ./installer

      - name: Prepare release files
        run: |
          (cd publish && zip -r "../ProsumentEneaItmTool_${VERSION}.zip" .)
          cp installer/ProsumentEneaItmToolSetup.exe "ProsumentEneaItmToolSetup_${VERSION}.exe"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Release v${VERSION}" \
            --notes "Automatycznie wygenerowane wydanie. Instalator: ProsumentEneaItmToolSetup_${VERSION}.exe, wersja bez instalacji: ProsumentEneaItmTool_${VERSION}.zip (wymaga .NET 8 Desktop Runtime)." \
            "ProsumentEneaItmTool_${VERSION}.zip" \
            "ProsumentEneaItmToolSetup_${VERSION}.exe"
